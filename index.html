<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靳泽欣 · 个人简历</title>

    <!-- ===== Fonts ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ===== Tailwind CDN (no preflight) ===== -->
    <script>
        tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ===== Lucide Icons ===== -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- ===== Custom Styles ===== -->
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #030712;
            color: #f1f5f9;
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: -200px; left: -150px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, rgba(6,182,212,0) 70%);
            filter: blur(140px);
            pointer-events: none;
            z-index: 1;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -200px; right: -150px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, rgba(99,102,241,0) 70%);
            filter: blur(140px);
            pointer-events: none;
            z-index: 1;
        }

        /* ============ STARFIELD CANVAS ============ */
        #starfield {
            position: fixed; inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Container */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        /* ============ NAVBAR ============ */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(3,7,18,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            height: 64px; display: flex; align-items: center;
        }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .navbar-brand {
            font-weight: 700; font-size: 1.05rem;
            background: linear-gradient(135deg, #22d3ee, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .navbar-brand small { -webkit-text-fill-color: #94a3b8; font-weight: 400; margin-left: 4px; }
        .navbar-links { display: flex; gap: 28px; align-items: center; }
        .navbar-links a {
            color: #cbd5e1; text-decoration: none; font-size: 0.9rem; font-weight: 500;
            transition: color 0.2s; position: relative;
        }
        .navbar-links a:hover { color: #22d3ee; }
        .navbar-actions { display: flex; gap: 8px; }
        .navbar-actions button {
            width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(15,23,42,0.6); color: #cbd5e1; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .navbar-actions button:hover { background: rgba(6,182,212,0.15); border-color: rgba(34,211,238,0.3); color: #22d3ee; }

        /* ============ HERO ============ */
        main { position: relative; z-index: 2; padding-top: 64px; }
        .hero { padding: 64px 0 48px; }
        .hero-grid { display: grid; grid-template-columns: 1fr auto; gap: 48px; align-items: center; }
        .hero-content h1 {
            font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 800; color: #fff; line-height: 1.2;
        }
        .hero-content h1 .highlight {
            background: linear-gradient(135deg, #22d3ee, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .hero-content .subtitle {
            display: flex; align-items: center; gap: 8px;
            color: #22d3ee; font-weight: 600; font-size: 1rem;
            margin-top: 12px;
        }
        .hero-content .bio {
            color: #94a3b8; font-size: 0.95rem; margin-top: 16px; max-width: 600px;
        }
        .hero-content .bio strong { color: #22d3ee; }

        .hero-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
        .hero-tags .tag {
            padding: 6px 14px; border-radius: 9999px; font-size: 0.8rem; font-weight: 500;
            background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.08); color: #cbd5e1;
            transition: all 0.2s;
        }
        .hero-tags .tag:hover { border-color: rgba(34,211,238,0.3); color: #22d3ee; }
        .hero-tags .tag.accent {
            background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(99,102,241,0.2));
            border-color: rgba(34,211,238,0.3); color: #22d3ee;
        }

        .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
        .btn {
            padding: 12px 24px; border-radius: 12px; font-size: 0.9rem; font-weight: 600;
            border: 1px solid transparent; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.25s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #6366f1); color: #fff; border: none;
            box-shadow: 0 0 20px rgba(6,182,212,0.25);
        }
        .btn-primary:hover { box-shadow: 0 0 32px rgba(6,182,212,0.45); transform: translateY(-2px); }
        .btn-accent {
            background: rgba(99,102,241,0.15); color: #a5b4fc; border-color: rgba(99,102,241,0.3);
        }
        .btn-accent:hover { background: rgba(99,102,241,0.25); box-shadow: 0 0 24px rgba(99,102,241,0.3); transform: translateY(-2px); }
        .btn-outline {
            background: transparent; color: #cbd5e1; border-color: rgba(255,255,255,0.15);
        }
        .btn-outline:hover { color: #22d3ee; border-color: rgba(34,211,238,0.4); transform: translateY(-2px); }

        .hero-stats { display: flex; gap: 24px; margin-top: 32px; flex-wrap: wrap; }
        .hero-stats .stat { display: flex; flex-direction: column; }
        .hero-stats .stat .num {
            font-size: 1.5rem; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, #fff, #cbd5e1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .hero-stats .stat .label { font-size: 0.8rem; color: #64748b; margin-top: 2px; }

        .hero-visual { display: flex; align-items: center; justify-content: center; }
        .hero-avatar {
            width: 200px; height: 200px; border-radius: 50%; overflow: hidden;
            border: 3px solid rgba(34,211,238,0.3);
            box-shadow: 0 0 40px rgba(6,182,212,0.25), 0 0 80px rgba(99,102,241,0.15);
            background: rgba(15,23,42,0.6);
        }
        .hero-avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* ============ SECTION ============ */
        .section { padding: 56px 0; }
        .section-header {
            display: flex; align-items: center; gap: 14px; margin-bottom: 32px;
        }
        .section-header .icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(99,102,241,0.2));
            border: 1px solid rgba(34,211,238,0.25);
            display: flex; align-items: center; justify-content: center; color: #22d3ee;
        }
        .section-header h2 { font-size: 1.4rem; font-weight: 800; color: #fff; }
        .section-header .line {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent);
        }

        /* ============ HIGHLIGHTS ============ */
        .highlights-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
        }
        .highlight-card {
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 28px 24px;
            text-align: center; transition: all 0.3s ease;
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            border-color: rgba(34,211,238,0.35);
            box-shadow: 0 0 32px rgba(6,182,212,0.18);
        }
        .highlight-card .emoji { font-size: 1.8rem; display: block; margin-bottom: 8px; }
        .highlight-card .value {
            font-size: 2.2rem; font-weight: 800;
            background: linear-gradient(135deg, #22d3ee, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            line-height: 1.2;
        }
        .highlight-card .desc { font-size: 0.85rem; color: #64748b; margin-top: 6px; }

        /* ============ TABS (Experience / Projects) ============ */
        .tabs-container { }
        .tabs-nav {
            display: flex; gap: 8px; margin-bottom: 24px; padding: 6px;
            background: rgba(15,23,42,0.5); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; width: fit-content;
        }
        .tabs-nav button {
            padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer;
            background: transparent; color: #94a3b8; font-size: 0.9rem; font-weight: 500;
            transition: all 0.2s;
        }
        .tabs-nav button[aria-selected="true"] {
            background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(99,102,241,0.2));
            color: #22d3ee; box-shadow: 0 0 16px rgba(6,182,212,0.15);
        }
        .tabs-panels { }
        .tabs-panel { display: none; }
        .tabs-panel.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ============ EXPERIENCE (Timeline) ============ */
        .exp-list { display: flex; flex-direction: column; gap: 16px; }
        .exp-item {
            position: relative; padding: 24px 24px 24px 28px;
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            transition: all 0.25s;
        }
        .exp-item:hover { border-color: rgba(34,211,238,0.25); transform: translateX(4px); }
        .exp-item::before {
            content: ''; position: absolute; left: 10px; top: 28px;
            width: 8px; height: 8px; border-radius: 50%;
            background: linear-gradient(135deg, #22d3ee, #818cf8);
            box-shadow: 0 0 12px rgba(6,182,212,0.4);
        }
        .exp-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .exp-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
        .exp-org { font-size: 0.85rem; color: #a5b4fc; font-weight: 500; }
        .exp-period {
            font-size: 0.78rem; color: #64748b; font-weight: 500;
            padding: 3px 10px; border-radius: 9999px;
            background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2);
        }
        .exp-desc { list-style: none; margin-top: 10px; padding: 0; }
        .exp-desc li {
            color: #94a3b8; font-size: 0.88rem; line-height: 1.6;
            padding-left: 16px; position: relative; margin-bottom: 4px;
        }
        .exp-desc li::before {
            content: ''; position: absolute; left: 0; top: 9px;
            width: 4px; height: 4px; border-radius: 50%; background: #22d3ee;
        }

        /* ============ PROJECTS ============ */
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .project-card {
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 24px;
            transition: all 0.25s;
        }
        .project-card:hover {
            border-color: rgba(34,211,238,0.3);
            transform: translateY(-4px);
            box-shadow: 0 0 32px rgba(6,182,212,0.15);
        }
        .proj-name { font-size: 1.05rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
        .proj-tech { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .proj-tech span {
            font-size: 0.72rem; font-weight: 500; color: #22d3ee;
            padding: 4px 10px; border-radius: 9999px;
            background: rgba(6,182,212,0.08); border: 1px solid rgba(34,211,238,0.2);
        }
        .proj-result { font-size: 0.85rem; color: #94a3b8; line-height: 1.55; margin-bottom: 14px; }
        .proj-link {
            font-size: 0.85rem; font-weight: 600; color: #22d3ee; text-decoration: none;
            display: inline-flex; align-items: center; gap: 4px;
            transition: all 0.2s;
        }
        .proj-link:hover { gap: 8px; }

        /* ============ SKILLS ============ */
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
        .skill-category {
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 22px;
            transition: all 0.25s;
        }
        .skill-category:hover { border-color: rgba(34,211,238,0.25); }
        .cat-name {
            font-size: 0.9rem; font-weight: 700; color: #fff; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .cat-name i { color: #22d3ee; }
        .skill-items { display: flex; flex-wrap: wrap; gap: 6px; }
        .skill-tag {
            font-size: 0.75rem; font-weight: 500; color: #cbd5e1;
            padding: 5px 12px; border-radius: 9999px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s;
        }
        .skill-tag:hover { border-color: rgba(34,211,238,0.3); color: #22d3ee; }

        /* ============ EDUCATION + CERTIFICATES ============ */
        .edu-cert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .edu-box, .cert-box {
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 28px;
        }
        .edu-school { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .edu-major { font-size: 0.9rem; color: #22d3ee; font-weight: 600; margin-top: 4px; }
        .edu-meta {
            display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px;
            font-size: 0.78rem; color: #94a3b8;
        }
        .edu-meta span {
            padding: 4px 12px; border-radius: 9999px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
        }
        .cert-box h4 {
            font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 18px;
            display: flex; align-items: center; gap: 8px;
        }
        .cert-box h4 i { color: #22d3ee; }
        .cert-gallery { display: flex; flex-direction: column; gap: 12px; }
        .cert-item {
            display: flex; gap: 14px; padding: 12px;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px; cursor: pointer; transition: all 0.2s;
        }
        .cert-item:hover { border-color: rgba(34,211,238,0.3); transform: translateX(4px); }
        .cert-thumb { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
        .cert-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .cert-info { flex: 1; min-width: 0; }
        .cert-name { font-size: 0.85rem; font-weight: 600; color: #fff; line-height: 1.3; }
        .cert-issuer { font-size: 0.75rem; color: #64748b; margin-top: 3px; }

        /* ============ FOOTER ============ */
        .footer {
            padding: 48px 0 32px; border-top: 1px solid rgba(255,255,255,0.06);
            margin-top: 40px;
        }
        .footer-links {
            display: flex; flex-wrap: wrap; gap: 16px;
            margin-bottom: 14px;
        }
        .footer-links a, .footer-links span {
            color: #94a3b8; font-size: 0.85rem; text-decoration: none;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .footer-links a:hover { color: #22d3ee; }
        .footer-meta { display: flex; flex-wrap: wrap; gap: 14px; color: #475569; font-size: 0.78rem; }

        /* ============ BACK TO TOP ============ */
        .back-top {
            position: fixed; bottom: 32px; right: 32px; z-index: 90;
            width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgba(34,211,238,0.3);
            background: rgba(15,23,42,0.8); backdrop-filter: blur(16px);
            color: #22d3ee; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 24px rgba(6,182,212,0.25);
            opacity: 0; pointer-events: none; transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .back-top.visible { opacity: 1; pointer-events: auto; transform: scale(1); }
        .back-top:hover { box-shadow: 0 0 32px rgba(6,182,212,0.5); transform: translateY(-3px); }

        /* ============ TOAST ============ */
        .toast {
            position: fixed; bottom: 90px; left: 50%; z-index: 2000;
            transform: translateX(-50%) translateY(20px);
            background: rgba(15,23,42,0.95); backdrop-filter: blur(20px);
            color: #e2e8f0; padding: 12px 28px; border-radius: 14px;
            border: 1px solid rgba(34,211,238,0.2);
            box-shadow: 0 8px 32px rgba(6,182,212,0.2);
            font-size: 0.88rem; font-weight: 500;
            opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

        /* ============ LIGHTBOX ============ */
        .lightbox {
            position: fixed; inset: 0; z-index: 3000;
            background: rgba(3,7,18,0.95); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .lightbox.show { opacity: 1; pointer-events: auto; }
        .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; box-shadow: 0 0 60px rgba(34,211,238,0.15); }
        .lightbox-close {
            position: absolute; top: 20px; right: 24px;
            width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(15,23,42,0.8); color: #e2e8f0; cursor: pointer;
            font-size: 1.4rem; display: flex; align-items: center; justify-content: center;
        }
        .lightbox-close:hover { border-color: rgba(34,211,238,0.4); color: #22d3ee; }

        /* ============ PROJECT MODAL ============ */
        .project-modal {
            position: fixed; inset: 0; z-index: 2500;
            background: rgba(3,7,18,0.9); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
            padding: 24px;
        }
        .project-modal.show { opacity: 1; pointer-events: auto; }
        .project-modal-content {
            background: rgba(15,23,42,0.9); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 32px;
            max-width: 900px; width: 100%; max-height: 85vh; overflow-y: auto;
        }
        .project-modal-header h3 {
            font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 14px;
        }
        .project-modal-tech { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .project-modal-tech span {
            font-size: 0.72rem; font-weight: 500; color: #22d3ee;
            padding: 4px 10px; border-radius: 9999px;
            background: rgba(6,182,212,0.08); border: 1px solid rgba(34,211,238,0.2);
        }
        .project-modal-header p { font-size: 0.88rem; color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }
        .project-modal-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .gallery-item {
            position: relative; border-radius: 10px; overflow: hidden;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer; transition: all 0.25s; aspect-ratio: 16/10;
        }
        .gallery-item:hover { border-color: rgba(34,211,238,0.3); transform: translateY(-2px); }
        .gallery-item img { width: 100%; height: 100%; object-fit: contain; background: #0f172a; }
        .gallery-caption {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(3,7,18,0.9));
            padding: 28px 10px 8px;
            font-size: 0.7rem; color: #cbd5e1; text-align: center;
        }
        .project-modal-close {
            position: absolute; top: 20px; right: 24px;
            width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(15,23,42,0.8); color: #e2e8f0; cursor: pointer;
            font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
        }
        .project-modal-close:hover { border-color: rgba(34,211,238,0.4); color: #22d3ee; }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 900px) {
            .hero-grid { grid-template-columns: 1fr; text-align: center; }
            .hero-avatar { width: 160px; height: 160px; margin: 0 auto; }
            .hero-tags, .hero-actions, .hero-stats { justify-content: center; }
            .highlights-grid { grid-template-columns: repeat(2, 1fr); }
            .edu-cert-grid { grid-template-columns: 1fr; }

        function createTabs(container, tabs, panelRenderer) {

            tabs.forEach((tab, idx) => {
                const btn = document.createElement('button');
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-selected', first ? 'true' : 'false');
                btn.setAttribute('aria-controls', `panel-${tab.id}`);
                btn.setAttribute('tabindex', first ? '0' : '-1');
                btn.id = `tab-${tab.id}`;
                btn.textContent = tab.label;
                nav.appendChild(btn);

                const panel = createEl('div', `tabs-panel ${first ? 'active' : ''}`);
                panel.id = `panel-${tab.id}`;
                panel.setAttribute('role', 'tabpanel');
                panel.setAttribute('aria-labelledby', `tab-${tab.id}`);
                panel.innerHTML = panelRenderer(tab.data);
                panels.appendChild(panel);

                if (first) first = false;
                btn.addEventListener('click', () => activateTab(tabs, idx, container));
                btn.addEventListener('keydown', (e) => {
                    const dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
                    if (dir) {
                        e.preventDefault();
                        const next = (idx + dir + tabs.length) % tabs.length;
                        activateTab(tabs, next, container);
                        const nextBtn = container.querySelector(`#tab-${tabs[next].id}`);
                        if (nextBtn) nextBtn.focus();
                    }
                });
            });
            container.appendChild(nav);
            container.appendChild(panels);
        }

            const panels = $$('[role="tabpanel"]', container);
            btns.forEach((b, i) => {
                b.setAttribute('aria-selected', i === idx ? 'true' : 'false');
                b.setAttribute('tabindex', i === idx ? '0' : '-1');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ---- Contact Button ----
        $('#contactBtn').addEventListener('click', () => {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(
                    `电话: ${resume.contact.phone}  微信: ${resume.contact.wechat}  邮箱: ${resume.contact.email}`
                ).then(() => showToast('✅ 联系方式已复制到剪贴板'));
            }
        });

        // ---- Copy Email ----
        $('#copyEmailBtn').addEventListener('click', () => {
            const user = 'studygg2026';
            const domain = 'outlook.com';
            const email = user + '@' + domain;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(email).then(() => showToast('✉️ 邮箱已复制: ' + email)).catch(() => fallbackCopy(email));
            } else {
                fallbackCopy(email);
            }
        });

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showToast('✉️ 邮箱已复制: ' + text); }
            catch (e) { showToast('📋 请手动复制: ' + text); }
            document.body.removeChild(ta);
        }

        // ---- Toast ----
        let toastTimer = null;
        function showToast(msg) {
            const toast = $('#toast');
            toast.textContent = msg; toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        // ---- Smooth nav anchors ----
        $$('a[href^="#"]').forEach(a => {
            a.addEventListener('click', (e) => {
                const target = document.querySelector(a.getAttribute('href'));
                if (target) {
                    e.preventDefault();
                    const offset = 80;
                    const top = target.getBoundingClientRect().top + window.scrollY - offset;
                    window.scrollTo({ top, behavior: 'smooth' });
                }
            });
        });

        // ---- Lightbox ----
        const lightbox = $('#lightbox');
        const lightboxImg = $('#lightboxImg');
        const lightboxClose = $('#lightboxClose');
        function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add('show'); }
        function closeLightbox() { lightbox.classList.remove('show'); lightboxImg.src = ''; }

        document.addEventListener('click', (e) => {
            const item = e.target.closest('.cert-item');
            if (item) { const img = item.querySelector('img'); if (img) openLightbox(img.src); }
        });
        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lightbox.classList.contains('show')) closeLightbox(); });

        // ---- Project Modal ----
        const projectModal = $('#projectModal');
        const projectModalClose = $('#projectModalClose');
        const projectModalTitle = $('#projectModalTitle');
        const projectModalTech = $('#projectModalTech');
        const projectModalResult = $('#projectModalResult');
        const projectModalGallery = $('#projectModalGallery');

        function openProjectModal(projectId) {
            const project = resume.projects.find(p => p.id === projectId);
            if (!project || !project.images || project.images.length === 0) return;
            projectModalTitle.textContent = project.name;
            projectModalTech.innerHTML = project.tech.map(t => `<span>${t}</span>`).join('');
            projectModalResult.textContent = project.result;
            projectModalGallery.innerHTML = project.images.map((img, i) => `
                <div class="gallery-item" data-index="${i}">
                    <img src="${img.src}" alt="${img.caption}" loading="lazy">
                    <div class="gallery-caption">${img.caption}</div>
                </div>`).join('');
            projectModalGallery.querySelectorAll('.gallery-item').forEach(item => {
                item.addEventListener('click', () => { const img = item.querySelector('img'); if (img) openLightbox(img.src); });
            });
            projectModal.classList.add('show');
        }
        function closeProjectModal() { projectModal.classList.remove('show'); projectModalGallery.innerHTML = ''; }

        document.addEventListener('click', (e) => {
            const link = e.target.closest('.proj-link');
            if (link && link.dataset.projectId) {
                e.preventDefault();
                const project = resume.projects.find(p => p.id === link.dataset.projectId);
                if (project && project.scrollTo) {
                    const target = document.querySelector(project.scrollTo);
                    if (target) {
                        const offset = 80;
                        const top = target.getBoundingClientRect().top + window.scrollY - offset;
                        window.scrollTo({ top, behavior: 'smooth' });
                    }
                } else {
                    openProjectModal(link.dataset.projectId);
                }
            }
        });
        projectModalClose.addEventListener('click', closeProjectModal);
        projectModal.addEventListener('click', (e) => { if (e.target === projectModal) closeProjectModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && projectModal.classList.contains('show')) closeProjectModal(); });

        // ---- Init ----
        // ============================================================
        //  DYNAMIC FOLLOW EFFECTS
        // ============================================================

        // ---- 1. Custom Cursor (dot + ring, separated easing) ----
        (function initCursor() {
            const isFine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
            if (!isFine) return;

            const dot = document.getElementById('cursorDot');
            const ring = document.getElementById('cursorRing');
            if (!dot || !ring) return;

            let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
            let dotX = mouseX, dotY = mouseY;
            let ringX = mouseX, ringY = mouseY;
            const DOT_EASE = 0.35;   // 内点跟手快
            const RING_EASE = 0.18;  // 外圈跟手慢 → 分离感

            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX; mouseY = e.clientY;
            });

            function tick() {
                dotX += (mouseX - dotX) * DOT_EASE;
                dotY += (mouseY - dotY) * DOT_EASE;
                ringX += (mouseX - ringX) * RING_EASE;
                ringY += (mouseY - ringY) * RING_EASE;
                dot.style.transform = `translate3d(${dotX}px, ${dotY}px, 0) translate(-50%, -50%)`;
                ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);

            // Hover state on interactive elements
            const HOVER_SEL = 'a, button, .highlight-card, .exp-item, .project-card, .skill-category, .edu-box, .cert-item, .gallery-item, .proj-link, .tag, .skill-tag, .tabs-nav button';
            document.addEventListener('mouseover', (e) => {
                if (e.target.closest(HOVER_SEL)) {
                    ring.classList.add('hover'); dot.classList.add('hover');
                }
            });
            document.addEventListener('mouseout', (e) => {
                if (e.target.closest(HOVER_SEL)) {
                    ring.classList.remove('hover'); dot.classList.remove('hover');
                }
            });

            // Hide on leave window
            document.addEventListener('mouseleave', () => {
                dot.style.opacity = '0'; ring.style.opacity = '0';
            });
            document.addEventListener('mouseenter', () => {
                dot.style.opacity = '1'; ring.style.opacity = '1';
            });
        })();

        // ---- 2. Card Tilt (mouse-driven perspective) ----
        (function initTilt() {
            const MAX_X = 14, MAX_Y = 14; // 最大倾斜角度

            function bindTilt(card) {
                card.addEventListener('mousemove', (e) => {
                    const r = card.getBoundingClientRect();
                    const x = (e.clientX - r.left) / r.width - 0.5;  // -0.5 ~ 0.5
                    const y = (e.clientY - r.top) / r.height - 0.5;
                    const rx = -y * MAX_X;
                    const ry = x * MAX_Y;
                    card.style.transform = `perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(0)`;
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transform = '';
                });
            }

            const SELECTORS = '.highlight-card, .exp-item, .project-card, .skill-category, .cert-item, .edu-box, .tilt-card';
            // 初始绑定
            document.querySelectorAll(SELECTORS).forEach(bindTilt);
            // 动态新增的卡片（tabs 切换时）也绑定
            const _observer = new MutationObserver((mutations) => {
                mutations.forEach((m) => {
                    m.addedNodes.forEach((n) => {
                        if (n.nodeType !== 1) return;
                        if (n.matches && n.matches(SELECTORS)) bindTilt(n);
                        if (n.querySelectorAll) n.querySelectorAll(SELECTORS).forEach(bindTilt);
                    });
                });
            });
            _observer.observe(document.body, { childList: true, subtree: true });
        })();

        // ---- 3. Hero Avatar Glow Follow ----
        (function initAvatarGlow() {
            const glow = document.querySelector('.hero-avatar-glow');
            const avatar = document.querySelector('.hero-avatar');
            if (!glow || !avatar) return;

            avatar.addEventListener('mousemove', (e) => {
                const r = avatar.getBoundingClientRect();
                const x = (e.clientX - r.left) / r.width - 0.5;
                const y = (e.clientY - r.top) / r.height - 0.5;
                glow.style.transform = `translate3d(${x * 40}px, ${y * 40}px, 0)`;
            });
            avatar.addEventListener('mouseleave', () => {
                glow.style.transform = 'translate3d(0, 0, 0)';
            });
        })();

        // ---- 4. Starfield (Canvas) ----
        (function initStarfield() {
            const canvas = document.getElementById('starfield');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // ---------- Star ----------
            class Star {
                constructor() { this.reset(true); }
                reset(init = false) {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.r = Math.random() * 1.3 + 0.2;          // 半径 0.2 ~ 1.5
                    this.baseAlpha = Math.random() * 0.7 + 0.2;   // 0.2 ~ 0.9
                    this.phase = Math.random() * Math.PI * 2;
                    this.speed = Math.random() * 0.015 + 0.005;   // 闪烁速度
                    if (!init) this.y = -5;
                }
                update() {
                    this.phase += this.speed;
                    this.alpha = this.baseAlpha + Math.sin(this.phase) * 0.25;
                    if (this.alpha > 1) this.alpha = 1;
                    if (this.alpha < 0.1) this.alpha = 0.1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r * dpr, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(226,232,240,${this.alpha})`;
                    ctx.fill();
                }
            }

            // ---------- Drifting Particle (柔和粒子飘散) ----------
            class DriftParticle {
                constructor() { this.reset(); }
                reset() {
                    // 从画面顶部随机位置生成
                    this.x = Math.random() * W * 1.2 - W * 0.1;
                    this.y = Math.random() * -H * 0.3 - 10;
                    // 速度：缓慢向下 + 轻微水平漂移
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = Math.random() * 0.35 + 0.15;
                    // 轻微横向摆动
                    this.swingAmp = Math.random() * 0.3 + 0.1;
                    this.swingFreq = Math.random() * 0.02 + 0.008;
                    this.phase = Math.random() * Math.PI * 2;
                    // 外观
                    this.r = Math.random() * 1.2 + 0.4;
                    this.hue = Math.random() * 40 + 180; // 青蓝 ~ 紫蓝
                    this.alpha = Math.random() * 0.6 + 0.3;
                    this.life = 1;
                    this.decay = Math.random() * 0.0015 + 0.0008; // 极慢衰减
                    this.lightPhase = Math.random() * Math.PI * 2;
                    this.active = true;
                }
                update() {
                    this.phase += this.swingFreq;
                    this.x += this.vx + Math.sin(this.phase) * this.swingAmp;
                    this.y += this.vy;
                    this.life -= this.decay;
                    this.lightPhase += 0.02;
                    if (this.y > H + 20 || this.life <= 0 || this.x < -20 || this.x > W + 20) {
                        this.reset();
                    }
                }
                draw() {
                    const twinkle = 0.7 + Math.sin(this.lightPhase) * 0.3;
                    const a = this.alpha * this.life * twinkle;
                    // 外发光
                    const glowR = this.r * 3;
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowR);
                    grad.addColorStop(0, `hsla(${this.hue}, 85%, 80%, ${a * 0.8})`);
                    grad.addColorStop(0.4, `hsla(${this.hue}, 80%, 65%, ${a * 0.3})`);
                    grad.addColorStop(1, `hsla(${this.hue}, 70%, 50%, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, glowR * dpr, 0, Math.PI * 2);
                    ctx.fill();
                    // 核心亮点
                    ctx.fillStyle = `hsla(${this.hue}, 90%, 95%, ${a})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r * dpr, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---------- Setup ----------
            let stars = [];
            let particles = [];

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);

                // 星星密度：每 8000px² 一颗
                const targetCount = Math.round((W * H) / 8000);
                stars = [];
                for (let i = 0; i < targetCount; i++) stars.push(new Star());

                // 粒子数量：每 30000px² 一颗
                if (!reduced) {
                    const pCount = Math.max(30, Math.round((W * H) / 30000));
                    particles = [];
                    for (let i = 0; i < pCount; i++) particles.push(new DriftParticle());
                } else {
                    particles = [];
                }
            }

            // ---------- Mouse parallax for stars ----------
            let mouseX = W / 2, mouseY = H / 2;
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX; mouseY = e.clientY;
            });

            // ---------- Loop ----------
            function loop() {
                ctx.clearRect(0, 0, W, H);

                // 星星（带鼠标视差）
                const px = (mouseX / W - 0.5) * 12;
                const py = (mouseY / H - 0.5) * 12;
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    if (!reduced) s.update();
                    const parallaxFactor = 0.3 + (s.r / 1.5) * 0.7; // 大点移动更多
                    ctx.save();
                    ctx.translate(px * parallaxFactor, py * parallaxFactor);
                    s.draw();
                    ctx.restore();
                }

                // 粒子飘散（柔和光点）
                if (!reduced) {
                    for (let i = 0; i < particles.length; i++) {
                        particles[i].update();
                        particles[i].draw();
                    }
                }

                requestAnimationFrame(loop);
            }

            resize();
            loop();
            window.addEventListener('resize', resize);
        })();

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            render();
        });
    </script>
</body>
</html>
